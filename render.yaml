services:
  - type: web
    name: lyceum23-psychologist
    runtime: python
    buildCommand: ./build.sh
    startCommand: ./start.sh
    envVars:
      - key: UV_VERSION
        value: "0.11.19"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: .onrender.com
      # SENTRY_DSN задаётся вручную в дашборде Render → Environment